# Production activation policy. This file is sourced by ota-activation-gate.
SAFE_STATE_FILE=/run/ota/safe_to_update
UPDATE_INHIBIT_FILE=/run/ota/update_inhibit
SAFE_STATE_MAX_AGE_SEC=30
MIN_FREE_KIB=18432
REQUIRE_WATCHDOG=1
REQUIRE_APP_HEALTH=1
APP_HEALTH_MAX_AGE_SEC=30
# enforce: current APP failure blocks activation.
# warn: audit the failure but permit a signed recovery update when the
# independent robot safety state, power and watchdog checks pass.
CURRENT_APP_HEALTH_MODE=enforce
# Canonical structured APP health-log directory. ota-healthd and the
# activation gate match demo_ai_<time>_<current-pid>.log in this directory.
APP_HEALTH_LOG_DIR=/mnt/sd
# One-time migration for a verified factory slot that predates APP health logs.
# It is inapplicable after the first confirmed OTA because ACTIVE_COUNTER > 0.
ALLOW_FACTORY_HEALTH_BOOTSTRAP=0
